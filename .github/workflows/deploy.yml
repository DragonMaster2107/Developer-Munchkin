name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test

      # Must happen before publish so the service worker integrity hashes match.
      - name: Set base href for GitHub Pages
        run: |
          sed -i 's|<base href="/" />|<base href="/Developer-Munchkin/" />|' src/DeveloperDungeon.Web/wwwroot/index.html
          grep -q '<base href="/Developer-Munchkin/" />' src/DeveloperDungeon.Web/wwwroot/index.html

      - name: Publish
        run: dotnet publish src/DeveloperDungeon.Web -c Release -o publish

      - name: SPA fallback and disable Jekyll
        run: |
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
